# Curated Dublin location presets — Stage 2.
#
# ~30 recognisable Dublin locations spanning hospitals, universities,
# shopping streets/centres, suburbs, transport hubs, and landmarks, so a
# demo instance can be built by name instead of raw coordinates.
#
# Coordinates are geocoded via Nominatim (see dlm.instance.geocode), with
# six exceptions (large campuses / an airport / a park / big out-of-town
# retail centres) where the geocoded centroid is farther than the default
# snap-distance guard from any drivable road — those instead use the
# nearest real drivable access point, found by nearest-node search
# against the Stage 1 graph rather than guessed. See
# docs/stages/stage-02-instances.md.

