[project]
name = "dlm"
version = "0.1.0"
description = "Disruption-aware last-mile routing on Dublin's road network (UCD ACM40960)"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Shlok Shetty" },
    { name = "Rushikesh Mane" },
]
dependencies = [
    "osmnx>=2.1,<2.2",
    "networkx>=3.2,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "folium>=0.16,<1",
    "shapely>=2.0,<3",
    "geopy>=2.4,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.32,<2",
    "streamlit-folium>=0.20,<1",
]
fleet = [
    "ortools>=9.9,<10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "playwright>=1.40",
]

[project.scripts]
dlm = "dlm.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "network: requires downloading (or reading the disk cache for) the real Dublin graph",
]
